[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "parcial_de_aprendizaje_automatico"
version = "0.0.1"
description = "Parcial de Aprendizaje Automatico: organizacion de datasets, notebook y archivos"
authors = [
  { name = "Daniel Rojas" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["parcial_de_aprendizaje_automatico"]
include = ["pyproject.toml", "parcial_de_aprendizaje_automatico/**/*.py"]
extend-exclude = [".pixi"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["parcial_de_aprendizaje_automatico"]
force-sort-within-sections = true

